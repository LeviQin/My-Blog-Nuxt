services:
  my-blog-nuxt:
    build:
      context: .
      dockerfile: Dockerfile

    image: my-blog-nuxt:latest

    container_name: my-blog-nuxt

    restart: unless-stopped

    ports:
      - "127.0.0.1:3006:3006"

    env_file:
      - /www/env/my-blog-nuxt.env

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3006

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3006/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    stop_grace_period: 10s
